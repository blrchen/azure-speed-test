<fieldset class="m-0 min-w-0 border-0 p-0 [&>legend]:mb-2">
  <legend class="form-label">{{ label() }}</legend>
  <details #filterDetails class="group relative">
    <summary
      #filterTrigger
      class="flex min-h-11 w-full cursor-pointer list-none items-center justify-between gap-3 rounded-md border border-border-strong bg-surface-raised py-2 pr-9 pl-3 text-sm leading-5 text-text-body outline-hidden hover:border-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary md:min-h-9 [&::-webkit-details-marker]:hidden"
      [attr.aria-label]="label() + ': ' + summary()"
    >
      <span class="truncate">{{ summary() }}</span>
      <app-lucide-icon
        name="chevron-down"
        class="absolute right-3 size-4 shrink-0 text-text-muted transition-transform group-open:rotate-180 motion-reduce:transition-none"
        aria-hidden="true"
      />
    </summary>

    <div
      class="absolute top-[calc(100%+0.375rem)] right-0 z-40 max-h-[min(32rem,calc(100dvh-2rem))] w-[min(22rem,calc(100vw-2rem))] overflow-x-hidden overflow-y-auto overscroll-contain rounded-lg border border-border-soft bg-surface-raised shadow-card-strong max-sm:fixed max-sm:top-1/2 max-sm:right-4 max-sm:left-4 max-sm:max-h-[calc(100dvh-2rem)] max-sm:w-auto max-sm:-translate-y-1/2"
    >
      <div
        class="flex min-h-10 items-center justify-between gap-4 border-b border-border-soft px-3 py-2"
      >
        <span class="text-xs font-semibold text-text-muted tabular-nums"> Common values </span>
        @if (hasSelection()) {
          <button type="button" class="link-primary text-xs font-semibold" (click)="clear()">
            Clear
          </button>
        }
      </div>

      <div
        class="scrollbar-thin max-h-56 overflow-y-auto overscroll-contain p-1"
        role="group"
        [attr.aria-label]="label() + ' values'"
      >
        <label
          class="flex min-h-10 cursor-pointer items-center gap-2.5 rounded-md px-2.5 py-2 hover:bg-surface-muted has-disabled:cursor-not-allowed has-disabled:opacity-60 has-[:focus-visible]:outline-2 has-[:focus-visible]:-outline-offset-2 has-[:focus-visible]:outline-primary"
        >
          <input
            type="radio"
            class="size-4 shrink-0 accent-primary disabled:cursor-not-allowed disabled:opacity-45"
            [attr.name]="controlId()"
            [checked]="!hasSelection()"
            (change)="clear()"
          />
          <span class="font-medium text-text-body">All</span>
        </label>

        @for (option of quickOptions(); track option.value) {
          <label
            class="flex min-h-10 cursor-pointer items-center gap-2.5 rounded-md px-2.5 py-2 hover:bg-surface-muted has-disabled:cursor-not-allowed has-disabled:opacity-60 has-[:focus-visible]:outline-2 has-[:focus-visible]:-outline-offset-2 has-[:focus-visible]:outline-primary"
          >
            <input
              type="radio"
              class="size-4 shrink-0 accent-primary disabled:cursor-not-allowed disabled:opacity-45"
              [attr.name]="controlId()"
              [value]="option.value"
              [checked]="isSelected(option.value)"
              [disabled]="option.count === 0"
              (change)="select(option.value)"
            />
            <span class="font-medium text-text-body" translate="no">
              {{ optionLabel(option.value) }}
            </span>
            <span class="ml-auto text-xs text-text-muted tabular-nums">
              {{ formatCount(option.count) }} SKUs
            </span>
          </label>
        }
      </div>

      <div
        class="grid gap-3 border-t border-border-soft p-3"
        role="group"
        [attr.aria-labelledby]="controlId() + '-range-label'"
      >
        <div>
          <p [id]="controlId() + '-range-label'" class="text-sm font-semibold text-text-strong">
            Custom
          </p>
          <p [id]="controlId() + '-range-hint'" class="mt-0.5 text-xs text-text-muted">
            Include both endpoints, for example 4 to 8.
          </p>
        </div>

        <div class="grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-end gap-2">
          <label class="grid min-w-0 gap-1.5 [&>.form-control]:min-w-0">
            <span class="text-xs font-semibold text-text-muted">Minimum</span>
            <input
              #minimumInput
              [id]="controlId() + '-range-minimum'"
              type="number"
              class="form-control form-control-focus-ring min-h-11 md:min-h-9"
              min="0"
              step="any"
              inputmode="decimal"
              [value]="selectedRange()?.minimum ?? ''"
              [attr.aria-describedby]="controlId() + '-range-hint ' + controlId() + '-range-error'"
              (input)="rangeError.set('')"
            />
          </label>
          <span class="pb-2 text-text-muted" aria-hidden="true">-</span>
          <label class="grid min-w-0 gap-1.5 [&>.form-control]:min-w-0">
            <span class="text-xs font-semibold text-text-muted">Maximum</span>
            <input
              #maximumInput
              [id]="controlId() + '-range-maximum'"
              type="number"
              class="form-control form-control-focus-ring min-h-11 md:min-h-9"
              min="0"
              step="any"
              inputmode="decimal"
              [value]="selectedRange()?.maximum ?? ''"
              [attr.aria-describedby]="controlId() + '-range-hint ' + controlId() + '-range-error'"
              (input)="rangeError.set('')"
              (keydown.enter)="
                applyRange(
                  minimumInput.value,
                  maximumInput.value,
                  minimumInput,
                  maximumInput,
                  filterDetails,
                  filterTrigger
                );
                $event.preventDefault()
              "
            />
          </label>
        </div>

        <div class="flex min-h-11 items-center justify-between gap-3">
          <p
            [id]="controlId() + '-range-error'"
            class="m-0 text-xs text-danger empty:hidden"
            role="alert"
            aria-live="assertive"
          >
            {{ rangeError() }}
          </p>
          <button
            type="button"
            class="btn btn-primary btn--sm min-h-11 md:min-h-9"
            (click)="
              applyRange(
                minimumInput.value,
                maximumInput.value,
                minimumInput,
                maximumInput,
                filterDetails,
                filterTrigger
              )
            "
          >
            Apply range
          </button>
        </div>
      </div>
    </div>
  </details>
</fieldset>
