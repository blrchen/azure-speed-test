<!doctype html>
<!-- Light is the default theme; the head script switches to dark before paint when stored. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      function applyInitialTheme() {
        const storageKey = 'THEME_PREFERENCE'
        const lightThemeColor = '#ffffff'
        const darkThemeColor = '#171717'
        let theme = null

        try {
          const storedTheme = localStorage.getItem(storageKey)
          if (storedTheme === 'dark' || storedTheme === 'light') {
            theme = storedTheme
          }
        } catch {
          theme = null
        }

        // No stored preference defaults to light, not the system setting.
        const shouldUseDarkTheme = theme === 'dark'
        document.documentElement.classList.toggle('dark', shouldUseDarkTheme)

        const themeColorMeta = document.querySelector('meta[name="theme-color"]')
        if (themeColorMeta) {
          themeColorMeta.setAttribute(
            'content',
            shouldUseDarkTheme ? darkThemeColor : lightThemeColor
          )
        }
      }

      applyInitialTheme()
    </script>
    <title>Azure Speed Test</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="canonical" href="https://www.azurespeed.com/Azure/Latency" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Azure Speed Test",
        "url": "https://www.azurespeed.com"
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
