<div class="group relative min-w-0 normal-case" [attr.data-code-style]="codeStyle() ? '' : null">
  <label
    class="mb-1.5 block text-micro leading-[1.2] font-bold tracking-[0.04em] text-text-muted uppercase"
    [for]="inputId()"
    >{{ label() }}</label
  >
  <div cdkOverlayOrigin #pickerOrigin="cdkOverlayOrigin" class="relative min-w-0">
    <app-lucide-icon
      name="search"
      class="pointer-events-none absolute top-1/2 left-3 z-1 size-4 -translate-y-1/2 text-text-muted"
      aria-hidden="true"
    />
    <input
      ngCombobox
      #combobox="ngCombobox"
      type="search"
      class="peer h-10 w-full overflow-hidden rounded-control border border-border-strong bg-surface-base px-9 text-sm font-[650] overflow-ellipsis whitespace-nowrap text-text-strong shadow-xs outline-hidden group-data-code-style:font-mono placeholder:font-sans placeholder:font-medium placeholder:text-text-placeholder not-disabled:hover:border-[color-mix(in_srgb,var(--color-primary)_55%,var(--color-border-strong))] focus-visible:border-primary focus-visible:shadow-[0_0_0_2px_var(--color-surface-base),0_0_0_4px_var(--color-primary)] disabled:cursor-not-allowed disabled:bg-surface-muted disabled:text-text-muted disabled:opacity-75 max-md:h-11"
      autocomplete="off"
      aria-autocomplete="list"
      [id]="inputId()"
      [disabled]="disabled()"
      [placeholder]="placeholder()"
      [value]="query()"
      [expanded]="expanded()"
      (focus)="openPicker()"
      (click)="openPicker()"
      (valueChange)="updateQuery($event)"
      (expandedChange)="updateExpanded($event)"
    />
    <app-lucide-icon
      name="chevron-down"
      class="pointer-events-none absolute top-1/2 right-3 z-1 size-4 -translate-y-1/2 text-text-muted transition-transform peer-aria-expanded:rotate-180 motion-reduce:transition-none"
      aria-hidden="true"
    />
  </div>

  <ng-template ngComboboxPopup [combobox]="combobox">
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="pickerOrigin"
      [cdkConnectedOverlayOpen]="true"
      [cdkConnectedOverlayPositions]="overlayPositions"
      [cdkConnectedOverlayMatchWidth]="true"
      [cdkConnectedOverlayFlexibleDimensions]="true"
      [cdkConnectedOverlayPush]="true"
      [cdkConnectedOverlayViewportMargin]="8"
      (overlayOutsideClick)="closeFromOutside($event)"
    >
      <div
        ngComboboxWidget
        ngListbox
        #listbox="ngListbox"
        class="w-full overflow-hidden rounded-[0.75rem] border border-border-soft bg-surface-raised shadow-lg"
        focusMode="activedescendant"
        selectionMode="explicit"
        [wrap]="true"
        [value]="selectedValues()"
        [activeDescendant]="listbox.activeDescendant()"
        (valueChange)="selectOption($event)"
      >
        <div class="scrollbar-thin max-h-[min(22rem,55vh)] overflow-y-auto p-1.5">
          @for (option of visibleOptions(); track option.value) {
            <div
              ngOption
              class="comparison-picker__option flex min-h-11 cursor-pointer items-center justify-between gap-3 rounded-control px-2.5 py-2 text-left text-text-body hover:bg-surface-muted hover:text-text-strong aria-selected:bg-[color-mix(in_srgb,var(--color-primary)_12%,var(--color-surface-raised))] data-active:bg-surface-muted data-active:text-text-strong"
              [value]="option.value"
              [label]="option.label + ' - ' + option.description"
            >
              <span
                class="comparison-picker__option-name min-w-0 text-compact leading-[1.3] font-bold wrap-anywhere"
                >{{ option.label }}</span
              >
              <span
                class="max-w-[52%] shrink-0 truncate text-micro font-semibold text-text-muted"
                >{{ option.description }}</span
              >
            </div>
          } @empty {
            <p class="px-3 py-6 text-center text-compact text-text-muted">
              No items match "{{ query() }}".
            </p>
          }
        </div>
        <p
          class="border-t border-border-soft px-3 py-2 text-micro leading-[1.35] text-text-muted"
          aria-live="polite"
        >
          {{ resultStatus() }}
        </p>
      </div>
    </ng-template>
  </ng-template>
</div>
