map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /not-found/index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 301 /Azure/Latency$is_args$args;
    }

    location ~* ^/(?:index\.html|Azure(?:/index\.html)?)/?$ {
        return 301 /Azure/Latency$is_args$args;
    }

    location ~* ^/Cloud/RegionFinder$ {
        return 301 /Azure/IPLookup$is_args$args;
    }

    location ~* ^/ChatGPT/AppList$ {
        return 301 https://emailwritingai.com/;
    }

    location ~* ^/ChatGPT/GenerateEmail$ {
        return 301 https://emailwritingai.com/email-generator$is_args$args;
    }

    location ~* ^/ChatGPT/PolishText$ {
        return 301 https://emailwritingai.com/text-polisher$is_args$args;
    }

    location ~* ^/Information/AzureIpRanges/?$ {
        return 301 /Information/AzureIpRanges/AzureCloud$is_args$args;
    }

    location ~* ^/Information/IpRange$ {
        return 301 /Information/AzureIpRanges/AzureCloud$is_args$args;
    }

    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ~ ^/Azure/IPLookup/[^/]+/?$ {
        try_files /index.csr.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /service-tags/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~* "^/.+-[0-9A-Za-z_]{8}\.(js|css|woff2)$" {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(json|xml|txt)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /not-found {
        error_page 404 /not-found/index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache" always;
        return 404;
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /not-found/index.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache" always;
    }
}
